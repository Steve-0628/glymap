    <script>
        let GLYMPSE_AUTH_KEY = ''
        let map = undefined
        let coortinates = []
        async function inigGlympse() {
            await initGMaps()

            const shareCode = document.querySelector("#share_code").value;
            const glympseAuthApi = "https://api.glympse.com/v2/account/login?password=password&api_key=0SLq661pXHmqdWgI8Yb1&username=viewer"
            const shareCodeApi = `https://api.glympse.com/v2/invites/${shareCode}?next=0&full_trail=true`

            if (!GLYMPSE_AUTH_KEY) {
                const authResp = await fetch(glympseAuthApi, {headers: {"Accept": "application/json"}})
                const authRespJson = await authResp.json();
                GLYMPSE_AUTH_KEY = authRespJson['response']['access_token']
                console.log(GLYMPSE_AUTH_KEY)
            } else {
                console.log("warn: auth already done")
            }

            if (!shareCode) {
                console.log("warn: no share code")
            } else {
                const share_resp = await fetch(shareCodeApi, {headers: {"Authorization": `Bearer ${GLYMPSE_AUTH_KEY}`}})
                const share_resp_json = (await share_resp.json())["response"]
                const locations = share_resp_json["location"]
                /*
                [
                    [timestamp, lat, lng, ...],
                    ...
                ] 
                */

                let [lastTimestamp, lastLat, lastLng, speed] = locations.shift()
                coortinates.push({
                    timestamp: lastTimestamp,
                    // timedelta: timestamp,
                    lat: lastLat,
                    lng: lastLng,
                    speed,
                })

                locations.forEach(e => {
                    const [timestamp, lat, lng, ] = e
                    lastTimestamp += timestamp;
                    lastLat += lat;
                    lastLng += lng;
                    coortinates.push({
                        timestamp: lastTimestamp,
                        timedelta: timestamp, 
                        lat: lastLat,
                        lng: lastLng,
                        speed,
                    })  
                })

                // const gpath = new google.maps.Polyline({
                //     path: coortinates.map(e => {return {lat: e.lat / 1000000, lng: e.lng / 1000000}}),
                //     geodesic: true,
                //     strokeColor: "#FF0000",
                //     strokeOpacity: 1.0,
                //     strokeWeight: 2,
                // })

                // gpath.setMap(map)

                renderPath()

                setTimeout(() => {
                    nextLocation(share_resp_json['next'])
                }, 5000)
            }
        }
        async function nextLocation(next) {
            const shareCode = document.querySelector("#share_code").value;
            const shareCodeApi = `https://api.glympse.com/v2/invites/${shareCode}?next=${next}`
            const shareResp = await fetch(shareCodeApi, {headers: {"Authorization": `Bearer ${GLYMPSE_AUTH_KEY}`}})
            const shareRespJson = (await shareResp.json())["response"]
            const locations = shareRespJson["location"]

            if (locations) {

                // let coortinates = []

                let [lastTimestamp, lastLat, lastLng, speed] = locations.shift()
                coortinates.push({
                    timestamp: lastTimestamp,
                    // timedelta: lastTimestamp, 
                    lat: lastLat,
                    lng: lastLng,
                    speed,
                })

                locations.forEach(e => {
                    const [timestamp, lat, lng, ] = e
                    lastTimestamp += timestamp;
                    lastLat += lat;
                    lastLng += lng;
                    coortinates.push({
                        timestamp: lastTimestamp,
                        timedelta: timestamp, 
                        lat: lastLat,
                        lng: lastLng,
                        speed,
                    })  
                })

                // const gpath = new google.maps.Polyline({
                //     path: coortinates.map(e => {return {lat: e.lat / 1000000, lng: e.lng / 1000000}}),
                //     geodesic: true,
                //     strokeColor: "#FF0000",
                //     strokeOpacity: 1.0,
                //     strokeWeight: 2,
                // })

                // gpath.setMap(map)

            } else {
                console.log('warn: no data')
            }

            setTimeout(() => {
                nextLocation(shareRespJson['next'])
            }, 5000)
        }
        async function renderPath() {
            const now = Date.now()
            const targetPoint = coortinates.shift();
            const nextPoint = coortinates[0];
            const nextNextPoint = coortinates[1]
            const gpath = new google.maps.Polyline({
                path: [
                    {
                        lat: targetPoint.lat / 1000000,
                        lng: targetPoint.lng / 1000000
                    },
                    {
                        lat: nextPoint.lat / 1000000,
                        lng: nextPoint.lng / 1000000,
                    }
                ],
                geodesic: true,
                strokeColor: "#FF0000",
                strokeOpacity: 1.0,
                strokeWeight: 2,
            })
            gpath.setMap(map)

            document.querySelector('#speed').innerHTML = nextPoint.speed * 0.036
            document.querySelector('#time').innerHTML = nextPoint.timestamp

            console.log(nextPoint, nextNextPoint, )

            while(!coortinates[0] || !coortinates[1]) {
                console.log("warn: not enough data")
                await new Promise(e => setTimeout(e, 200))
            }

            if (coortinates[0] && coortinates[1]) {
                if (now - nextPoint.timestamp > 10000) {
                    renderPath()
                } else {
                    const current = Date.now()
                    const delta = nextPoint.timedelta - (current - now)
                    if (delta < 0) {
                        renderPath()
                    } else {
                        setTimeout(renderPath, nextPoint.timedelta - (current - now));
                    }
                }
            }
        }
        
        async function initGMaps() {
            const { Map } = await google.maps.importLibrary("maps");
            const map_element = document.querySelector("#map_canvas")
            map = new Map(map_element, {
                center: { lat: 35.6681, lng: 139.5760 },
                zoom: 8,
            });
        }
        function initGmapsScript() {
            initGoogleAPI(document.querySelector("#gmaps_key").value)
        }
    </script>

    <div>
